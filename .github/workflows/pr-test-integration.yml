name: Integration Tests

on:
  push:
    branches:
      - main
      - release-*.*.*
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions: {}

jobs:
  detect-changes:
    # Run on `grafana/grafana` main branch, or on pull requests to prevent double-running on mirrors
    if: (github.event_name == 'pull_request' || (github.event_name == 'push' && github.repository == 'grafana/grafana'))
    name: Detect whether code changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.detect-changes.outputs.backend }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true # required to get more history in the changed-files action
          fetch-depth: 2
      - name: Detect changes
        id: detect-changes
        uses: ./.github/actions/change-detection
        with:
          self: .github/workflows/pr-test-integration.yml

  #### OSS
  sqlite:
    # Run this workflow only for PRs from forks
    needs: detect-changes
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true && needs.detect-changes.outputs.changed == 'true'
    strategy:
      matrix:
        # We don't need more than this since it has to wait for the other tests.
        shard: [
          1/4, 2/4, 3/4, 4/4,
        ]
      fail-fast: false

    name: Sqlite (${{ matrix.shard }})
    runs-on: ubuntu-x64-large-io
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Go
        uses: ./.github/actions/setup-go
      - name: Run tests
        env:
          SHARD: ${{ matrix.shard }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          readarray -t PACKAGES <<< "$(./scripts/ci/backend-tests/pkgs-with-tests-named.sh -b TestIntegration | ./scripts/ci/backend-tests/shard.sh -N "$SHARD" -d -)"
          go test -timeout=8m -run '^TestIntegration' "${PACKAGES[@]}"

  mysql:
    # Run this workflow only for PRs from forks
    needs: detect-changes
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true && needs.detect-changes.outputs.changed == 'true'
    strategy:
      matrix:
        shard: [
           1/16,  2/16,  3/16,  4/16,
           5/16,  6/16,  7/16,  8/16,
           9/16, 10/16, 11/16, 12/16,
          13/16, 14/16, 15/16, 16/16,
        ]
      fail-fast: false

    name: MySQL (${{ matrix.shard }})
    runs-on: ubuntu-x64-large-io
    permissions:
      contents: read
    env:
      GRAFANA_TEST_DB: mysql
      MYSQL_HOST: 127.0.0.1
    services:
      mysql:
        image: mysql:8.0.43
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: grafana_tests
          MYSQL_USER: grafana
          MYSQL_PASSWORD: password
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=3
        ports:
          - 3306:3306
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Go
        uses: ./.github/actions/setup-go
      - name: Setup MySQL devenv
        run: mysql -h 127.0.0.1 -P 3306 -u root -prootpass < devenv/docker/blocks/mysql_tests/setup.sql
      - name: Run tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          readarray -t PACKAGES <<< "$(./scripts/ci/backend-tests/pkgs-with-tests-named.sh -b TestIntegration | ./scripts/ci/backend-tests/shard.sh -N"$SHARD" -d-)"
          echo "Precompiling, no tests will be run"
          CGO_ENABLED=0 go test -run='^$' "${PACKAGES[@]}"
          echo "Running tests now"
          CGO_ENABLED=0 go test -p=1 -timeout=12m -run '^TestIntegration' "${PACKAGES[@]}"

  postgres:
    # Run this workflow only for PRs from forks
    needs: detect-changes
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true && needs.detect-changes.outputs.changed == 'true'
    strategy:
      matrix:
        shard: [
           1/16,  2/16,  3/16,  4/16,
           5/16,  6/16,  7/16,  8/16,
           9/16, 10/16, 11/16, 12/16,
          13/16, 14/16, 15/16, 16/16,
        ]
      fail-fast: false

    name: Postgres (${{ matrix.shard }})
    runs-on: ubuntu-x64-large-io
    permissions:
      contents: read
    env:
      GRAFANA_TEST_DB: postgres
      PGPASSWORD: grafanatest
      POSTGRES_HOST: 127.0.0.1
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Start Postgres via docker compose
        run: |
          make devenv sources=postgres_tests
      - name: Setup Go
        uses: ./.github/actions/setup-go
      - name: Setup Postgres devenv
        run: psql -p 5432 -h 127.0.0.1 -U grafanatest -d grafanatest -f devenv/docker/blocks/postgres_tests/setup.sql
      - name: Run tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          readarray -t PACKAGES <<< "$(./scripts/ci/backend-tests/pkgs-with-tests-named.sh -b TestIntegration | ./scripts/ci/backend-tests/shard.sh -N"$SHARD" -d-)"
          echo "Precompiling, no tests will be run"
          CGO_ENABLED=0 go test -run='^$' "${PACKAGES[@]}"
          echo "Running tests now"
          CGO_ENABLED=0 go test -p=1 -timeout=8m -run '^TestIntegration' "${PACKAGES[@]}"
      - name: Cleanup Postgres
        if: always()
        run: |
          make devenv-down sources=postgres_tests

  #### Enterprise
  sqlite-enterprise:
    # Run this workflow for non-PR events (like pushes to `main` or `release-*`) OR for internal PRs (PRs not from forks)
    needs: detect-changes
    if: github.event_name != 'pull_request' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && needs.detect-changes.outputs.changed == 'true')
    strategy:
      matrix:
        shard: [
           1/16,  2/16,  3/16,  4/16,
           5/16,  6/16,  7/16,  8/16,
           9/16, 10/16, 11/16, 12/16,
          13/16, 14/16, 15/16, 16/16,
        ]
      fail-fast: false

    name: Sqlite Enterprise (${{ matrix.shard }})
    runs-on: ubuntu-x64-large-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Enterprise
        uses: ./.github/actions/setup-enterprise
        with:
          github-app-name: 'grafana-ci-bot'
      # Enterprise must be cloned before setup-go so that enterprise
      # modules are visible when the Go cache key is computed.
      - name: Setup Go
        uses: ./.github/actions/setup-go
      - name: Run tests
        env:
          SHARD: ${{ matrix.shard }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          readarray -t PACKAGES <<< "$(./scripts/ci/backend-tests/pkgs-with-tests-named.sh -b TestIntegration | ./scripts/ci/backend-tests/shard.sh -N "$SHARD" -d -)"
          go test -tags=enterprise -timeout=8m -run '^TestIntegration' "${PACKAGES[@]}"

  mysql-enterprise:
    # Run this workflow for non-PR events (like pushes to `main` or `release-*`) OR for internal PRs (PRs not from forks)
    needs: detect-changes
    if: github.event_name != 'pull_request' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && needs.detect-changes.outputs.changed == 'true')
    strategy:
      matrix:
        shard: [
           1/16,  2/16,  3/16,  4/16,
           5/16,  6/16,  7/16,  8/16,
           9/16, 10/16, 11/16, 12/16,
          13/16, 14/16, 15/16, 16/16,
        ]
      fail-fast: false

    name: MySQL Enterprise (${{ matrix.shard }})
    runs-on: ubuntu-x64-large-io
    permissions:
      contents: read
      id-token: write
    env:
      GRAFANA_TEST_DB: mysql
      MYSQL_HOST: 127.0.0.1
    services:
      mysql:
        image: mysql:8.0.43
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: grafana_tests
          MYSQL_USER: grafana
          MYSQL_PASSWORD: password
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=3
        ports:
          - 3306:3306
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Enterprise
        uses: ./.github/actions/setup-enterprise
        with:
          github-app-name: 'grafana-ci-bot'
      # Enterprise must be cloned before setup-go so that enterprise
      # modules are visible when the Go cache key is computed.
      - name: Setup Go
        uses: ./.github/actions/setup-go
      - name: Setup MySQL devenv
        run: mysql -h 127.0.0.1 -P 3306 -u root -prootpass < devenv/docker/blocks/mysql_tests/setup.sql
      - name: Run tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          readarray -t PACKAGES <<< "$(./scripts/ci/backend-tests/pkgs-with-tests-named.sh -b TestIntegration | ./scripts/ci/backend-tests/shard.sh -N"$SHARD" -d-)"
          echo "Precompiling, no tests will be run"
          CGO_ENABLED=0 go test -tags=enterprise -run='^$' "${PACKAGES[@]}"
          echo "Running tests now"
          CGO_ENABLED=0 go test -p=1 -tags=enterprise -timeout=12m -run '^TestIntegration' "${PACKAGES[@]}"

  postgres-enterprise:
    # Run this workflow for non-PR events (like pushes to `main` or `release-*`) OR for internal PRs (PRs not from forks)
    needs: detect-changes
    if: github.event_name != 'pull_request' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && needs.detect-changes.outputs.changed == 'true')
    strategy:
      matrix:
        shard: [
           1/16,  2/16,  3/16,  4/16,
           5/16,  6/16,  7/16,  8/16,
           9/16, 10/16, 11/16, 12/16,
          13/16, 14/16, 15/16, 16/16,
        ]
      fail-fast: false

    name: Postgres Enterprise (${{ matrix.shard }})
    runs-on: ubuntu-x64-large-io
    permissions:
      contents: read
      id-token: write
    env:
      GRAFANA_TEST_DB: postgres
      PGPASSWORD: grafanatest
      POSTGRES_HOST: 127.0.0.1
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Start Postgres via docker compose
        run: |
          make devenv sources=postgres_tests
      - name: Setup Enterprise
        uses: ./.github/actions/setup-enterprise
        with:
          github-app-name: 'grafana-ci-bot'
      # Enterprise must be cloned before setup-go so that enterprise
      # modules are visible when the Go cache key is computed.
      - name: Setup Go
        uses: ./.github/actions/setup-go
      - name: Setup Postgres devenv
        run: psql -p 5432 -h 127.0.0.1 -U grafanatest -d grafanatest -f devenv/docker/blocks/postgres_tests/setup.sql
      - name: Run tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          readarray -t PACKAGES <<< "$(./scripts/ci/backend-tests/pkgs-with-tests-named.sh -b TestIntegration | ./scripts/ci/backend-tests/shard.sh -N"$SHARD" -d-)"
          echo "Precompiling, no tests will be run"
          CGO_ENABLED=0 go test -tags=enterprise -run='^$' "${PACKAGES[@]}"
          echo "Running tests now"
          CGO_ENABLED=0 go test -p=1 -tags=enterprise -timeout=8m -run '^TestIntegration' "${PACKAGES[@]}"
      - name: Cleanup Postgres
        if: always()
        run: |
          make devenv-down sources=postgres_tests

  # Graphite datasource integration tests — run against multiple Graphite server versions.
  # Tests in pkg/tsdb/graphite/graphite_integration_test.go are skipped when GRAPHITE_URL
  # is absent, making them zero-cost for regular runs and opt-in for local dev.
  graphite:
    needs: detect-changes
    if: needs.detect-changes.outputs.changed == 'true'
    name: Graphite integration (${{ matrix.graphite.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        graphite:
          - name: graphite-1.0
            image: graphiteapp/graphite-statsd:1.0.2-3
            port: 80
            url: http://localhost:8180
          - name: graphite-1.1
            image: graphiteapp/graphite-statsd:latest
            port: 80
            url: http://localhost:8180
          - name: carbonapi
            compose: devenv/docker/blocks/carbonapi/docker-compose.yaml
            port: 8480
            url: http://localhost:8480
          # bookingcom/carbonapi does not publish Docker images; build from source.
          # This exercises the backend-routing behaviour (strict query formatting,
          # separate carbonzipper model) that caused the Booking.com regressions.
          - name: bookingcom-carbonapi
            build: source
            url: http://localhost:8580
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Start Graphite (${{ matrix.graphite.name }})
        if: ${{ matrix.graphite.image != '' && matrix.graphite.image != null }}
        run: |
          docker run -d --name graphite -p 8180:${{ matrix.graphite.port }} \
            ${{ matrix.graphite.image }}
          timeout 60 bash -c 'until curl -sf http://localhost:8180/; do sleep 2; done'

      - name: Start carbonapi stack
        if: ${{ matrix.graphite.compose != '' && matrix.graphite.compose != null }}
        run: |
          docker compose -f ${{ matrix.graphite.compose }} up -d

          # Wait for go-carbon's carbonserver HTTP to accept connections.
          # Port 8580 on the host maps to go-carbon:8080 (carbonserver).
          # We accept any HTTP response (even 500) — we just need the server to be up.
          # This must complete before polling carbonapi, as carbonapi connects to
          # go-carbon on startup and may hang/crash if the backend is not yet ready.
          echo "Waiting for go-carbon carbonserver (port 8580)..."
          timeout 60 bash -c '
            until curl -s -o /dev/null -w "%{http_code}" "http://localhost:8580/metrics/find?query=test&format=json" | grep -qE "^[0-9]{3}$"; do
              sleep 2
            done
          '

          # Seed the metric now, before waiting for carbonapi.  Seeding early gives
          # go-carbon's write loop and index scanner the maximum time to process the
          # file before tests run.
          # go-carbon returns HTTP 500 from /metrics/find until at least one whisper
          # file exists; fake-carbonapi-data has a startup race so we seed directly.
          # Use python3 (always available on Ubuntu runners) instead of nc, because
          # Ubuntu's netcat-openbsd does not support the GNU -q flag.
          echo "Seeding test metric into go-carbon..."
          # Use a flat (no-dot) metric name so query=* returns it as a top-level leaf.
          # Multi-segment names (e.g. integration.test.metric) require non-leaf directory
          # traversal which go-carbon's trigram index returns 500 for when only 1 metric
          # exists; a flat name avoids this edge case entirely.
          python3 -c "import socket,time; s=socket.socket(); s.connect(('localhost',2013)); s.sendall(b'grafanatest 42 '+str(int(time.time())).encode()+b'\n'); s.close(); print('Seeded grafanatest')"
          # Allow the write loop to flush the metric to a whisper file on disk.
          sleep 3

          # Wait for carbonapi to be up. constantLine() is evaluated by carbonapi
          # itself and needs no backend, so it returns 200 as soon as the process starts.
          echo "Waiting for carbonapi (port 8480)..."
          timeout 90 bash -c '
            until curl -sf "http://localhost:8480/render?target=constantLine(1)&format=json&from=-1min" > /dev/null; do
              sleep 3
            done
          ' || {
            echo "ERROR: carbonapi did not become ready. Container logs:"
            docker compose -f ${{ matrix.graphite.compose }} logs carbonapi --tail=30
            docker compose -f ${{ matrix.graphite.compose }} logs go-carbon --tail=20
            exit 1
          }

          # Verify go-carbon's index directly (port 8580, bypasses carbonapi's cache).
          # scan-frequency=3s means the trie-index is rebuilt within ~3s of the
          # whisper file appearing.  We query for "grafanatest" specifically (the flat
          # metric we seeded) and grep the response body for the metric name.
          # NOTE: query=* on go-carbon returns 500 when top-level entries are only
          # directory nodes (multi-segment metrics from fake-carbonapi-data); querying
          # by name is reliable regardless of what else is in the index.
          # NOTE: go-carbon's carbonserver returns HTTP 301 for /metrics/find (no
          # trailing slash); use the trailing-slash URL to avoid the redirect.
          echo "Waiting for go-carbon index to include seeded metric (direct check)..."
          timeout 90 bash -c '
            until curl -sL "http://localhost:8580/metrics/find/?query=grafanatest&format=json" 2>/dev/null | grep -q "grafanatest"; do
              sleep 2
            done
          ' || {
            echo "ERROR: go-carbon index not ready after 90s. Diagnostics:"
            echo "=== go-carbon direct response ==="
            curl -vL "http://localhost:8580/metrics/find/?query=grafanatest&format=json" 2>&1 || true
            echo "=== go-carbon logs ==="
            docker compose -f ${{ matrix.graphite.compose }} logs go-carbon --tail=40
            exit 1
          }

          # Now wait for carbonapi's metrics/find to agree.
          # Carbonapi caches find results (defaultTimeoutSec=10); also the find timeout
          # between carbonapi and go-carbon may add latency on slow CI runners.
          # Grep body for the metric name — carbonapi returns HTTP 200 with [] (empty)
          # for unknown metrics, so checking status alone is not sufficient.
          echo "Waiting for carbonapi metrics/find to reflect indexed metric..."
          timeout 90 bash -c '
            until curl -s "http://localhost:8480/metrics/find?query=grafanatest&format=json" 2>/dev/null | grep -q "grafanatest"; do
              sleep 2
            done
          ' || {
            echo "ERROR: carbonapi metrics/find not ready. Diagnostics:"
            echo "=== carbonapi response ==="
            curl -v "http://localhost:8480/metrics/find?query=grafanatest&format=json" 2>&1 || true
            echo "=== go-carbon direct response ==="
            curl -vL "http://localhost:8580/metrics/find/?query=grafanatest&format=json" 2>&1 || true
            echo "=== carbonapi logs ==="
            docker compose -f ${{ matrix.graphite.compose }} logs carbonapi --tail=40
            exit 1
          }

      - name: Build and start bookingcom/carbonapi
        if: ${{ matrix.graphite.build == 'source' }}
        run: |
          docker compose -f devenv/docker/blocks/carbonapi-booking/docker-compose.yaml up -d --build --wait --timeout 120

      - name: Run integration tests
        env:
          GRAPHITE_URL: ${{ matrix.graphite.url }}
        run: |
          go test -run '^TestIntegrationGraphite' -timeout=3m -v ./pkg/tsdb/graphite/...

  # This is the job that is actually required by rulesets.
  # We want to only require one job instead of all the individual tests and shards.
  # Future work also allows us to start skipping some tests based on changed files.
  required-backend-integration-tests:
    needs:
      - mysql
      - postgres
      - sqlite
      - mysql-enterprise
      - postgres-enterprise
      - sqlite-enterprise
    # always() is the best function here.
    # success() || failure() will skip this function if any need is also skipped.
    # That means conditional test suites will fail the entire requirement check.
    if: always()

    name: All backend integration tests complete
    runs-on: ubuntu-latest
    steps:
      - name: Check test suites
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          FAILURES="$(echo "$NEEDS" | jq 'with_entries(select(.value.result == "failure")) | map_values(.result)')"
          echo "$FAILURES"
          if [ "$(echo "$FAILURES" | jq '. | length')" != "0" ]; then
            exit 1
          fi
          echo "All OK!"
